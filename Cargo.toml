[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/windows",
  "crates/hid-tap",
  "crates/hid-tap/agent",
  "apps/desktop",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
